<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniGrab — Universal Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0f111a',
                            card: '#161925',
                            border: '#2a2e42',
                            accent: '#8b5cf6',
                            accentHover: '#a855f7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f111a;
            background-image: radial-gradient(circle at top, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2e42; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4 font-sans antialiased">

    <!-- Main Window -->
    <div class="bg-brand-card w-full max-w-3xl rounded-2xl shadow-2xl border border-brand-border overflow-hidden flex flex-col">
        
        <!-- Title Bar -->
        <div class="h-14 border-b border-brand-border flex items-center justify-between px-6 bg-[#12141f]">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-accent to-purple-400 flex items-center justify-center shadow-lg shadow-brand-accent/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </div>
                <span class="font-bold text-lg tracking-wide text-white">OmniGrab</span>
                <span class="text-[10px] bg-brand-accent/20 text-brand-accent px-2 py-0.5 rounded-full border border-brand-accent/30 font-semibold">v1.0.0</span>
            </div>
            <div class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-slate-600 hover:bg-red-500 cursor-pointer transition-colors"></div>
                <div class="w-3 h-3 rounded-full bg-slate-600 hover:bg-yellow-500 cursor-pointer transition-colors"></div>
                <div class="w-3 h-3 rounded-full bg-slate-600 hover:bg-green-500 cursor-pointer transition-colors"></div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="p-8 space-y-6">
            
            <!-- URL Input -->
            <div class="space-y-2">
                <label class="text-sm font-medium text-slate-400">Paste media URL</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                    <input type="text" class="w-full bg-[#0f111a] border border-brand-border rounded-xl py-3 pl-12 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-all font-mono text-sm" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                    <button class="absolute inset-y-1 right-1 px-4 bg-brand-border hover:bg-slate-700 rounded-lg text-xs font-medium transition-colors">Paste</button>
                </div>
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-medium text-slate-400">Format</label>
                    <div class="relative">
                        <select class="w-full bg-[#0f111a] border border-brand-border rounded-xl py-2.5 px-4 text-sm text-white appearance-none focus:outline-none focus:border-brand-accent transition-colors cursor-pointer">
                            <option>MP4 (Video)</option>
                            <option>MP3 (Audio)</option>
                            <option>WEBM</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-medium text-slate-400">Quality</label>
                    <div class="relative">
                        <select class="w-full bg-[#0f111a] border border-brand-border rounded-xl py-2.5 px-4 text-sm text-white appearance-none focus:outline-none focus:border-brand-accent transition-colors cursor-pointer">
                            <option>1080p (Best)</option>
                            <option>720p (HD)</option>
                            <option>4K (Ultra)</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <button class="w-full bg-brand-accent hover:bg-brand-accentHover text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-brand-accent/20 flex items-center justify-center gap-2 group">
                <svg class="w-5 h-5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Media
            </button>

            <!-- Progress Simulation (Hidden by default, just for design) -->
            <div class="bg-[#0f111a] border border-brand-border rounded-xl p-4 space-y-3">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-300">Downloading: Never Gonna Give You Up.mp4</span>
                    <span class="text-brand-accent font-mono">45%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div class="bg-brand-accent h-2 rounded-full w-[45%] shadow-[0_0_10px_rgba(139,92,246,0.8)]"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                    <span>4.2 MB/s</span>
                    <span>ETA: 00:12</span>
                </div>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="bg-[#12141f] border-t border-brand-border px-6 py-3 flex justify-between items-center text-xs text-slate-500">
            <div>Ready to grab.</div>
            <div class="flex gap-4">
                <span class="hover:text-slate-300 cursor-pointer">Settings</span>
                <span class="hover:text-slate-300 cursor-pointer">About</span>
            </div>
        </div>
    </div>

</body>
</html>
